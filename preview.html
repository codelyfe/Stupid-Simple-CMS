<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stupid Simple CMS</title>
  <link rel="stylesheet" href="css/custom.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body style="background-image:url('https://cdn.pixabay.com/photo/2019/07/22/20/36/mountains-4356017_1280.jpg');background-color:#1c1c1c;">
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">
    <a class="navbar-brand" href="#">Stupid Simple CMS</a>
    <a class="nav-write" href="#"><i class="fa-solid fa-feather"></i> Write</a>
  </div>
</nav>
<div class="page-wrap">
  <form class="search-bar" onsubmit="return false;">
    <input class="form-control" placeholder="Search articles">
    <button type="button">Search</button>
  </form>
  <article class="article">
    <div class="article-meta">
      <span class="badge">Stories</span>
      <span class="badge">Nov 12, 2023</span>
    </div>
    <img class="img-fluid" alt="" src="https://cdn.pixabay.com/photo/2019/07/22/20/36/mountains-4356017_1280.jpg">
    <h2 class="blog-title">A quieter way to publish</h2>
    <p class="blog-content">Cards, type, and one theme request instead of six. The blog stays file-based, just easier to scan.</p>
    <div class="article-actions">
      <a class="share-btn" href="#"><i class="fa-regular fa-clipboard"></i></a>
      <a class="share-btn" href="#"><i class="fa-brands fa-facebook"></i></a>
      <a class="article-btn btn" href="#" style="background:#000;color:#fff;">Read more</a>
    </div>
  </article>
</div>
<footer class="site-footer"><p>Powered by Stupid Simple CMS</p></footer>
</body>
</html>
